name: CI

# Typecheck + unit testleri her push ve PR'da çalıştırır.
# Amaç: bayat/bozuk testlerin (örn. imza değişmiş servis spec'leri) ve tip
# hatalarının main'e sızmasını engellemek. Unit testler Prisma client'ı
# mock'lar — gerçek PostgreSQL/Redis gerektirmez.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @asm/shared build

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate

      - name: Typecheck (api — spec dosyaları dahil)
        run: pnpm --filter api exec tsc --noEmit -p tsconfig.json

      - name: Typecheck (worker)
        run: pnpm --filter worker exec tsc --noEmit

      - name: Typecheck (web)
        run: pnpm --filter @asm/web exec tsc -b

      - name: Test (api)
        run: pnpm --filter api test

      - name: Test (worker)
        run: pnpm --filter worker test
