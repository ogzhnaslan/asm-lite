name: CI

# Typecheck + unit testleri her push ve PR'da çalıştırır.
# Amaç: bayat/bozuk testlerin (örn. imza değişmiş servis spec'leri) ve tip
# hatalarının main'e sızmasını engellemek. Unit testler Prisma client'ı
# mock'lar — gerçek PostgreSQL/Redis gerektirmez.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @asm/shared build

      - name: Generate Prisma client
        run: |
          (cd apps/api && pnpm exec prisma generate)
          # pnpm + Prisma custom-output tip senkronizasyonu (CLAUDE.md'de belgeli
          # quirk): generate çıktısı apps/api/node_modules/.prisma/client'a yazılır
          # ama @prisma/client import'u, store'daki paketin yanındaki .prisma/client'a
          # çözülür. Temiz install'da bu kopya yok → @prisma/client model tiplerini
          # export etmez → typecheck patlar. Üretilen client'ı store'daki her
          # @prisma/client paketinin node_modules'una .prisma/client olarak kopyalarız.
          src="apps/api/node_modules/.prisma/client"
          synced=0
          for nm in node_modules/.pnpm/@prisma+client@*/node_modules; do
            [ -d "$nm" ] || continue
            mkdir -p "$nm/.prisma/client"
            cp -r "$src/." "$nm/.prisma/client/"
            synced=$((synced + 1))
          done
          echo "Prisma client store kopyaları senkronize edildi: $synced"
          if [ "$synced" -eq 0 ]; then
            echo "::error::Prisma client store senkronizasyonu 0 hedef buldu — glob/path bozuk"
            exit 1
          fi

      - name: Typecheck (api — spec dosyaları dahil)
        run: pnpm --filter api exec tsc --noEmit -p tsconfig.json

      - name: Typecheck (worker)
        run: pnpm --filter worker exec tsc --noEmit

      - name: Typecheck (web)
        run: pnpm --filter @asm/web exec tsc -b

      - name: Test (api)
        run: pnpm --filter api test

      - name: Test (worker)
        run: pnpm --filter worker test
