name: CI

# Typecheck + unit testleri her push ve PR'da çalıştırır.
# Amaç: bayat/bozuk testlerin (örn. imza değişmiş servis spec'leri) ve tip
# hatalarının main'e sızmasını engellemek. Unit testler Prisma client'ı
# mock'lar — gerçek PostgreSQL/Redis gerektirmez.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @asm/shared build

      - name: Generate Prisma client
        run: |
          (cd apps/api && pnpm exec prisma generate)
          # pnpm + Prisma custom-output tip senkronizasyonu (CLAUDE.md'de belgeli
          # quirk): generate çıktısı apps/api/node_modules/.prisma/client'a yazılır
          # ama @prisma/client import'u pnpm store'daki .prisma/client kopyasına
          # çözülür. Temiz install'da store kopyası stub kalır → typecheck patlar.
          # Üretilen client'ı store kopyalarına eşitleyerek bunu önlüyoruz.
          src="apps/api/node_modules/.prisma/client"
          synced=0
          for dest in node_modules/.pnpm/@prisma+client@*/node_modules/.prisma/client; do
            if [ -d "$(dirname "$dest")" ]; then
              mkdir -p "$dest"
              cp -r "$src/." "$dest/"
              synced=$((synced+1))
            fi
          done
          echo "Prisma client store kopyaları senkronize edildi: $synced"

      - name: Typecheck (api — spec dosyaları dahil)
        run: pnpm --filter api exec tsc --noEmit -p tsconfig.json

      - name: Typecheck (worker)
        run: pnpm --filter worker exec tsc --noEmit

      - name: Typecheck (web)
        run: pnpm --filter @asm/web exec tsc -b

      - name: Test (api)
        run: pnpm --filter api test

      - name: Test (worker)
        run: pnpm --filter worker test
